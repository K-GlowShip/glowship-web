name: Deploy Dev

# develop 에 push 되면 Vite 빌드 결과물을 S3 에 올리고 CloudFront 캐시를 비운다 (dev 배포).
#
# 흐름: checkout → pnpm install → pnpm build(VITE_API_BASE_URL 주입) → OIDC 로 AWS 역할 가정(비밀키 없음)
#       → S3 동기화(해시 붙은 assets 는 장기 캐시, index.html 은 캐시 안 함) → CloudFront 무효화
#
# 사용자 접근 경로: https://<CloudFront 도메인> 의 기본 경로가 이 S3 버킷, /api/* 는 백엔드(EC2) 로 간다.
# SPA 라우팅(/login 등 → index.html)은 CloudFront Function 이 처리하므로 여기서는 파일만 올리면 된다.
#
# GitHub 저장소 Settings 에 미리 넣어야 하는 값
#   Secrets   AWS_ROLE_ARN                 Actions 가 가정할 IAM 역할 ARN (S3 동기화·CloudFront 무효화 권한만)
#   Variables AWS_REGION                   S3 버킷 리전 (예: ap-northeast-2)
#   Variables WEB_BUCKET                   빌드 결과물을 올릴 S3 버킷 이름
#   Variables CLOUDFRONT_DISTRIBUTION_ID   무효화할 CloudFront 배포 ID
#   Variables VITE_API_BASE_URL            빌드에 들어가는 API 주소. 프론트와 같은 CloudFront 도메인(https://...)
#   Environment dev                        배포 job 이 사용 (이력·승인자)
#
# AWS 쪽 준비: IAM 역할의 신뢰 정책은 이 저장소의 develop(ref)과 environment dev 의 OIDC 토큰만 허용한다.
# 이 저장소는 OIDC 주체를 ID 포함 불변 형식(repo:<조직>@<id>/<저장소>@<id>:...)으로 쓰도록 설정돼 있다.

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to S3 + CloudFront
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        # VITE_* 는 빌드 시점에 번들에 들어간다 (src/shared/config/env.ts). VITE_DEMO_LOGIN 은 넣지 않는다(실서버 연동 배포).
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: pnpm build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync hashed assets (long cache)
        # Vite 가 파일명에 해시를 붙이는 assets/ 는 내용이 바뀌면 이름도 바뀌므로 1년 캐시·immutable 로 둔다.
        env:
          BUCKET: ${{ vars.WEB_BUCKET }}
        run: |
          aws s3 sync dist/assets "s3://${BUCKET}/assets" \
            --delete \
            --cache-control "public, max-age=31536000, immutable"

      - name: Sync other files (no cache)
        # index.html 과 public/ 의 파일은 이름이 고정이라 캐시하지 않는다. assets/ 는 위에서 올렸으므로 제외.
        env:
          BUCKET: ${{ vars.WEB_BUCKET }}
        run: |
          aws s3 sync dist "s3://${BUCKET}" \
            --delete \
            --exclude "assets/*" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront cache
        env:
          DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          invalidation_id="$(aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*" \
            --query 'Invalidation.Id' --output text)"
          echo "invalidation: $invalidation_id"
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION_ID" --id "$invalidation_id"

      - name: Summary
        run: |
          {
            echo "### Deployed web (dev)"
            echo "- commit: \`${GITHUB_SHA::7}\`"
            echo "- bucket: \`${{ vars.WEB_BUCKET }}\`"
            echo "- API base: \`${{ vars.VITE_API_BASE_URL }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
